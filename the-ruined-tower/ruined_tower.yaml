    name: "Shadow-Touched Skeleton (Talven)"
    type: "undead_skeleton"
    description: "The animated corpse of Vaelith's apprentice Talven, killed 30 years ago in a failed shadow purification ritual. The bones are blackened with shadow corruption, and wisps of darkness curl around the skeletal form like living smoke. Its eye sockets burn with eerie purple light. It wears dark blue ritual robes embroidered with silver runes. It rises when living beings enter the ritual chamber."
    strength: 12
    dexterity: 10
    constitution: 10
    intelligence: 3
    wisdom: 10
    charisma: 1
    hit_dice: "1+2 (1d8+2)"
    hit_points: 8
    max_hit_points: 8
    armor_class: 7
    thac0: 19
    attacks_per_round: 1
    damage_per_attack: ["1d4 + chill touch"]
    movement_rate: 90
    special_abilities:
      - "Immune to sleep, charm, and hold spells"
      - "Immune to poison and cold"
      - "Takes half damage from slashing/piercing weapons"
      - "Vulnerable to bludgeoning weapons (+1 damage per die)"
      - "Chill Touch: On hit, Save vs Paralysis or -1 to hit next round (cold numbness)"
      - "Shadow Whispers: Living creatures in room Save vs Magic each round or -1 to hit (cumulative, max -3)"
      - "Can only be permanently destroyed with Turn Undead or by blessing the ritual circle"
      - "Turns as 2 HD undead"
    saving_throws:
      paralyzation_poison_death_magic: 13
      petrification_polymorph: 14
      rod_staff_wand: 13
      breath_weapon: 15
      spell: 14
    treasure_type: "Talven's ring + shadow crystal (on corpse)"
    current_room_id: "ritual_chamber"
    morale: 12
    is_alive: true

