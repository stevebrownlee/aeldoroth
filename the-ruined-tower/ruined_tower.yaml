    name: "Water-Damaged Journal Page"
    description: "A torn page from Vaelith's research journal, water-stained but partially legible. Contains two important clues: (1) 'third stone behind... crate from town... hidden...' pointing to a wall cache, and (2) 'Lux Memoriae... ritual circle... Talven remains...' hinting at a secret chamber and its password. The handwriting is shaky and distressed."
    value: 0
    type: "quest_item"
    location_room_id: "library"
    location_description: "tucked between pages of the spellbook, as if used as a bookmark"
    weight: 0.0
    is_hidden: false
    is_magical: false
    effect: "DUAL CLUE: Reveals (1) location of hidden treasure cache in Room 5, and (2) password 'Lux Memoriae' and existence of ritual chamber below library"
    is_collected: false

