    is_collected: false

  illusionists_spellbook:
    id: "illusionists_spellbook"
    name: "Vaelith's Spellbook"
    description: "A water-damaged but still legible spellbook bound in blue leather with silver clasp. Contains two 2nd-level illusionist spells: Invisibility and Mirror Image. The pages smell of old parchment and lingering magic. Margin notes are in Vaelith's hand. Worth 200-500 gp to an illusionist."
    value: 500
    type: "magic_item"
    location_room_id: "library"
    location_description: "on the collapsed reading table, partially buried under debris and torn pages"
    weight: 3.0
    is_hidden: false
