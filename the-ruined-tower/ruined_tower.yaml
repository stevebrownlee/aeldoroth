coinage:
  description: "Coin values expressed in copper pieces (AD&D 1E). Treasure value in gp = sum(count x value_in_cp) / 100. House rule: 1 gp of treasure value = 1 XP. Electrum (ep) is unused in this adventure."
  value_in_cp:
    pp: 500
    gp: 100
    ep: 50
    sp: 10
    cp: 1

initial_treasure:
  healing_potion:
    id: "healing_potion"
    name: "Potion of Healing"
    description: "A small glass vial containing a red liquid that glows faintly in the darkness. The cork is sealed with wax. The liquid smells faintly of herbs and magic."
    value: 50
    type: "potion"
    location_room_id: "library"
    location_description: "hidden inside a hollowed-out book on the shelf (DC 12 to find while searching)"
    weight: 0.1
    is_hidden: true
